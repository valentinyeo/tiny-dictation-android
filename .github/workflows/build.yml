name: Build APK

on:
  push:
    branches: [ main, master, 'claude/**' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          cache-disabled: true

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Setup debug keystore
        run: |
          # Check if debug keystore exists in repo, if not create one
          if [ ! -f "app/debug.keystore" ]; then
            echo "Creating debug keystore..."
            keytool -genkeypair -v -keystore app/debug.keystore \
              -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass android -keypass android \
              -dname "CN=Debug, OU=Debug, O=Debug, L=Debug, ST=Debug, C=US"
            echo "KEYSTORE_CREATED=true" >> $GITHUB_ENV
          else
            echo "Using existing debug keystore from repo"
          fi

      - name: Build APK
        run: ./gradlew assembleDebug

      - name: Commit debug keystore if newly created
        if: env.KEYSTORE_CREATED == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add app/debug.keystore
          git commit -m "Add debug keystore for consistent signing"
          git push

      - name: Get version info
        id: version
        run: |
          # Extract versionName from build.gradle.kts
          VERSION_NAME=$(grep 'versionName' app/build.gradle.kts | head -1 | sed 's/.*"\(.*\)".*/\1/')
          VERSION_CODE=$(grep 'versionCode' app/build.gradle.kts | head -1 | sed 's/[^0-9]*//g')
          echo "version_name=${VERSION_NAME}" >> $GITHUB_OUTPUT
          echo "version_code=${VERSION_CODE}" >> $GITHUB_OUTPUT
          echo "sha_short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
          echo "Extracted version: ${VERSION_NAME} (code: ${VERSION_CODE})"

      - name: Rename APK
        run: |
          mv app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/TinyDictation-v${{ steps.version.outputs.version_name }}-${{ steps.version.outputs.sha_short }}.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: TinyDictation-APK
          path: app/build/outputs/apk/**/TinyDictation-*.apk
          retention-days: 30

      - name: Send Telegram notification
        if: success()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -n "$TELEGRAM_BOT_TOKEN" ] && [ -n "$TELEGRAM_CHAT_ID" ]; then
            curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
              -d chat_id="${TELEGRAM_CHAT_ID}" \
              -d text="*Tiny Dictation v${{ steps.version.outputs.version_name }}* (${{ steps.version.outputs.sha_short }})%0A%0A[Download APK](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})" \
              -d parse_mode="Markdown"
          else
            echo "Telegram secrets not configured, skipping notification"
          fi

      - name: Send Telegram notification on failure
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -n "$TELEGRAM_BOT_TOKEN" ] && [ -n "$TELEGRAM_CHAT_ID" ]; then
            curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
              -d chat_id="${TELEGRAM_CHAT_ID}" \
              -d text="*Tiny Dictation Build Failed*%0A%0A[View Logs](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})" \
              -d parse_mode="Markdown"
          else
            echo "Telegram secrets not configured, skipping notification"
          fi
