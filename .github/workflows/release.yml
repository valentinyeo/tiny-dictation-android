name: Release APK

on:
  push:
    tags:
      - 'v*'
    branches:
      - 'claude/**'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version name (e.g., 1.0.0)'
        required: true
        default: '1.1.0'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          cache-disabled: true

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Setup signing configuration
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          : "${KEYSTORE_BASE64:?Missing KEYSTORE_BASE64 secret}"
          : "${KEYSTORE_PASSWORD:?Missing KEYSTORE_PASSWORD secret}"
          : "${KEY_ALIAS:?Missing KEY_ALIAS secret}"
          : "${KEY_PASSWORD:?Missing KEY_PASSWORD secret}"
          umask 077
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          {
            printf 'RELEASE_KEYSTORE_FILE=%s\n' "$RUNNER_TEMP/release.keystore"
            printf 'RELEASE_KEYSTORE_PASSWORD=%s\n' "$KEYSTORE_PASSWORD"
            printf 'RELEASE_KEY_ALIAS=%s\n' "$KEY_ALIAS"
            printf 'RELEASE_KEY_PASSWORD=%s\n' "$KEY_PASSWORD"
          } >> "$GITHUB_ENV"

      - name: Build APK
        run: ./gradlew assembleRelease

      - name: Remove signing credentials
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/release.keystore"
          unset RELEASE_KEYSTORE_FILE RELEASE_KEYSTORE_PASSWORD RELEASE_KEY_ALIAS RELEASE_KEY_PASSWORD
          {
            printf 'RELEASE_KEYSTORE_FILE=\n'
            printf 'RELEASE_KEYSTORE_PASSWORD=\n'
            printf 'RELEASE_KEY_ALIAS=\n'
            printf 'RELEASE_KEY_PASSWORD=\n'
          } >> "$GITHUB_ENV"

      - name: Get version info
        id: version
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            echo "version=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
            echo "tag=v${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
          elif [[ "${{ github.ref }}" == refs/tags/* ]]; then
            echo "version=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT
            echo "tag=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          else
            # Extract version from build.gradle.kts
            VERSION=$(grep 'versionName' app/build.gradle.kts | head -1 | sed 's/.*"\(.*\)".*/\1/')
            echo "version=$VERSION" >> $GITHUB_OUTPUT
            echo "tag=v$VERSION" >> $GITHUB_OUTPUT
          fi
          echo "date=$(date +'%Y-%m-%d')" >> $GITHUB_OUTPUT

      - name: Rename APKs
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p dist
          for apk in app/build/outputs/apk/release/*.apk; do
            ABI=${apk##*/app-}
            ABI=${ABI%-release.apk}
            mv "$apk" "dist/TinyDictation-${VERSION}-${ABI}.apk"
          done

      - name: Verify release APK signers
        run: python3 tools/check_release_apk_signer.py dist/TinyDictation-*.apk

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Tiny Dictation v${{ steps.version.outputs.version }}
          body: |
            ## Tiny Dictation v${{ steps.version.outputs.version }}

            Released: ${{ steps.version.outputs.date }}

            ### Download
            Choose the APK for your device architecture:
            - **arm64-v8a** - Most modern Android devices (recommended)
            - **armeabi-v7a** - Older 32-bit ARM devices

            ### Installation
            1. Download the appropriate APK for your device
            2. Enable "Install from unknown sources" if prompted
            3. Open the APK to install
            4. Grant permissions when asked
          files: dist/TinyDictation-*.apk
          fail_on_unmatched_files: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish in-app update
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: bash tools/publish-update.sh "dist/TinyDictation-${{ steps.version.outputs.version }}-arm64-v8a.apk"

      - name: Send Telegram notification
        if: success()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -n "$TELEGRAM_BOT_TOKEN" ] && [ -n "$TELEGRAM_CHAT_ID" ]; then
            BASE_URL="https://github.com/${{ github.repository }}/releases/download/${{ steps.version.outputs.tag }}"
            TITLE="<b>Tiny Dictation v${{ steps.version.outputs.version }}</b>"
            LINKS="<a href=\"${BASE_URL}/TinyDictation-${{ steps.version.outputs.version }}-arm64-v8a.apk\">Download (ARM64)</a> | <a href=\"${BASE_URL}/TinyDictation-${{ steps.version.outputs.version }}-armeabi-v7a.apk\">ARM32</a>"
            printf -v MESSAGE '%s\n\n%s' "$TITLE" "$LINKS"
            curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
              --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
              --data-urlencode "text=${MESSAGE}" \
              --data-urlencode "parse_mode=HTML"
          else
            echo "Telegram secrets not configured, skipping notification"
          fi
