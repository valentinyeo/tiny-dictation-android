name: Release APK

on:
  push:
    tags:
      - 'v*'
    branches:
      - 'claude/**'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version name (e.g., 1.0.0)'
        required: true
        default: '1.1.0'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          cache-disabled: true

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Setup signing configuration
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "Using release signing configuration"
          else
            echo "Using debug signing (no secrets configured)"
          fi

      - name: Build Release APK
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleDebug

      - name: Get version info
        id: version
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            echo "version=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
            echo "tag=v${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
          elif [[ "${{ github.ref }}" == refs/tags/* ]]; then
            echo "version=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT
            echo "tag=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          else
            # Extract version from build.gradle.kts
            VERSION=$(grep 'versionName' app/build.gradle.kts | head -1 | sed 's/.*"\(.*\)".*/\1/')
            echo "version=$VERSION" >> $GITHUB_OUTPUT
            echo "tag=v$VERSION" >> $GITHUB_OUTPUT
          fi
          echo "date=$(date +'%Y-%m-%d')" >> $GITHUB_OUTPUT

      - name: Rename APKs
        run: |
          # With ABI splits, APKs are named app-{abi}-debug.apk
          cd app/build/outputs/apk/debug
          for apk in app-*-debug.apk; do
            if [ -f "$apk" ]; then
              ABI=$(echo "$apk" | sed 's/app-\(.*\)-debug.apk/\1/')
              NEW_NAME="TinyDictation-${{ steps.version.outputs.version }}-${ABI}.apk"
              mv "$apk" "$NEW_NAME"
              echo "Renamed $apk to $NEW_NAME"
            fi
          done
          # Fallback for universal APK
          if [ -f "app-debug.apk" ]; then
            mv app-debug.apk "TinyDictation-${{ steps.version.outputs.version }}.apk"
          fi
          ls -la

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Tiny Dictation v${{ steps.version.outputs.version }}
          body: |
            ## Tiny Dictation v${{ steps.version.outputs.version }}

            Released: ${{ steps.version.outputs.date }}

            ### Download
            Choose the APK for your device architecture:
            - **arm64-v8a** - Most modern Android devices (recommended)
            - **armeabi-v7a** - Older 32-bit ARM devices

            ### Installation
            1. Download the appropriate APK for your device
            2. Enable "Install from unknown sources" if prompted
            3. Open the APK to install
            4. Grant permissions when asked
          files: app/build/outputs/apk/debug/TinyDictation-*.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Send Telegram notification
        if: success()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -n "$TELEGRAM_BOT_TOKEN" ] && [ -n "$TELEGRAM_CHAT_ID" ]; then
            BASE_URL="https://github.com/${{ github.repository }}/releases/download/${{ steps.version.outputs.tag }}"
            TITLE="<b>Tiny Dictation v${{ steps.version.outputs.version }}</b>"
            LINKS="<a href=\"${BASE_URL}/TinyDictation-${{ steps.version.outputs.version }}-arm64-v8a.apk\">Download (ARM64)</a> | <a href=\"${BASE_URL}/TinyDictation-${{ steps.version.outputs.version }}-armeabi-v7a.apk\">ARM32</a>"
            printf -v MESSAGE '%s\n\n%s' "$TITLE" "$LINKS"
            curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
              --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
              --data-urlencode "text=${MESSAGE}" \
              --data-urlencode "parse_mode=HTML"
          else
            echo "Telegram secrets not configured, skipping notification"
          fi
